# Render Blueprint for the DraftMaster AI API.
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Render reads this
# file, builds the API image, provisions Postgres and wires DATABASE_URL in.
#
# The API is already live on Render; this file makes that deployment reproducible
# and, critically, provisions a *paid* Postgres. Render's free Postgres expires
# 30 days after creation, which would silently delete every paying customer's
# entitlement and every subscriber record.
#
# IMPORTANT: a service created by hand in the dashboard is NOT managed by this
# file. That is why production currently reports `sqlite+pysqlite` from /health
# — no DATABASE_URL was ever injected. Recreate the service from this Blueprint
# (or set DRAFTMASTER_DATABASE_URL manually) to make entitlements survive a deploy.
services:
  - type: web
    name: draftmaster-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    plan: starter # free spins down after 15 min idle; cold starts kill conversion
    region: frankfurt
    # Track the same branch Vercel deploys as production, so API and web never
    # drift apart. `main` is only where tagged releases land.
    branch: import-implementation
    healthCheckPath: /health
    autoDeploy: true # deploys on every push to the production branch
    envVars:
      - key: DRAFTMASTER_ENVIRONMENT
        value: production
      # Render injects `postgres://…`; normalize_database_url in infra.py rewrites
      # it to the psycopg 3 driver. Do not hand-edit the scheme here.
      - key: DRAFTMASTER_DATABASE_URL
        fromDatabase:
          name: draftmaster-db
          property: connectionString
      # Same value under Render's conventional name. The app reads the
      # DRAFTMASTER_-prefixed key above; this alias keeps the dashboard readable
      # and keeps any tooling that expects DATABASE_URL working.
      - key: DATABASE_URL
        fromDatabase:
          name: draftmaster-db
          property: connectionString
      - key: DRAFTMASTER_CORS_ORIGINS
        value: https://www.draftmaster.wiki
      # Set these in the dashboard (sync: false keeps them out of git):
      - key: DRAFTMASTER_SECRET_KEY
        sync: false
      - key: DRAFTMASTER_OPENDOTA_API_KEY
        sync: false
      - key: DRAFTMASTER_LEMONSQUEEZY_API_KEY
        sync: false
      - key: DRAFTMASTER_LEMONSQUEEZY_STORE_ID
        sync: false
      - key: DRAFTMASTER_LEMONSQUEEZY_CHECKOUT_URL
        sync: false
      - key: DRAFTMASTER_LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false

databases:
  - name: draftmaster-db
    plan: basic-256mb # paid: the free tier expires 30 days after creation
    region: frankfurt
    postgresMajorVersion: "16"
