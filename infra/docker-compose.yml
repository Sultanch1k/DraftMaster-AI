version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: draftmaster
      POSTGRES_PASSWORD: draftmaster
      POSTGRES_DB: draftmaster
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draftmaster"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      DRAFTMASTER_ENVIRONMENT: production
      DRAFTMASTER_DATABASE_URL: postgresql+psycopg://draftmaster:draftmaster@postgres:5432/draftmaster
      DRAFTMASTER_REDIS_URL: redis://redis:6379/0
      DRAFTMASTER_CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://api:8000
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes: ["../apps/web:/app"]
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
