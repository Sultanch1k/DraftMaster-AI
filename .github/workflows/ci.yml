name: CI

on:
  push:
    # import-implementation is the repo default and the Vercel production
    # branch, so it must be gated too — main is only where releases land.
    branches: [main, import-implementation]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-api:
    name: Engine + API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e services/engine
      - name: Validate committed artifacts
        run: |
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("data/artifacts/draftmaster-data.json").read_text())
          assert len(data["heroes"]) >= 120, len(data["heroes"])
          assert data["counters"]["matrix"], "counter matrix empty"
          hashes = json.loads(pathlib.Path("data/artifacts/hero-hashes.json").read_text())
          assert len(hashes["heroes"]) >= 120, len(hashes["heroes"])
          print(f"artifacts ok: {len(data['heroes'])} heroes, patch {data['patch']['name']}")
          PY
      - name: Tests
        run: python -m pytest services/engine/tests -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          API_PROXY_TARGET: http://127.0.0.1:8000
